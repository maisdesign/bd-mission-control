<style>
  :root {
    --bg: #040814; --bar: rgba(6, 12, 30, 0.92); --line: rgba(0, 240, 255, 0.15);
    --accent: #00f0ff; --accent-rgb: 0, 240, 255; --amber: #ffb800; --green: #10b981;
    --red: #ef4444; --blue: #60a5fa; --muted: #64748b; --text: #e2e8f0; --text-2: #94a3b8;
    --card: rgba(6, 12, 30, 0.6);
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at center, #0b1528 0%, #030712 100%) fixed, var(--bg);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: stretch; gap: 0; min-height: 48px;
    background: var(--bar); border-bottom: 1px solid var(--line);
    box-shadow: 0 0 24px rgba(var(--accent-rgb), 0.08); position: relative; z-index: 2;
  }
  .brand {
    display: flex; align-items: center; gap: 10px; padding: 0 18px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); white-space: nowrap; border-right: 1px solid var(--line);
    text-shadow: 0 0 10px rgba(var(--accent-rgb), 0.5);
  }
  .brand svg { width: 18px; height: 18px; }
  nav { display: flex; align-items: stretch; flex: 1; flex-wrap: wrap; min-width: 0; }
  .tab {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px;
    padding: 0 13px; min-height: 47px; border-right: 1px solid var(--line); white-space: nowrap;
    font-size: 13px; color: var(--text-2); position: relative;
  }
  .tab:hover { color: var(--text); background: rgba(var(--accent-rgb), 0.04); }
  .tab:focus-visible { outline: 1px solid var(--accent); outline-offset: -3px; }
  .tab[aria-selected="true"] { color: var(--text); background: rgba(var(--accent-rgb), 0.08); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
  }
  .tab .label { font-weight: 600; }
  .tab .key { display: none; }
  .badge { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: rgba(var(--accent-rgb), 0.08); color: var(--text-2); }
  .badge.wip { color: var(--amber); background: rgba(255, 184, 0, 0.1); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.busy { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.6s infinite; }
  .dot.waiting { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 0.9s infinite; }
  .dot.shell { background: var(--blue); }
  .dot.idle { background: var(--muted); }
  .dot.none { background: transparent; border: 1px dashed var(--muted); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
  .filter { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-left: 1px solid var(--line); font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .filter[hidden] { display: none; }
  .filter select { max-width: 320px; background: #0b1528; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font: 13px -apple-system, "Segoe UI", sans-serif; letter-spacing: 0; text-transform: none; }
  .filter select:focus-visible { outline: 1px solid var(--accent); }
  .meta { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-left: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .meta .live { color: var(--green); }
  .meta .stale { color: var(--red); }
  .meta button { font: inherit; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  .meta button:hover { color: var(--text); }
  .meta button[aria-pressed="true"] { color: var(--green); border-color: currentColor; }
  main { flex: 1; position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: block; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
  #overview { overflow: auto; padding: 24px 28px 40px; }
  #overview h1 { font-family: var(--mono); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-2); font-weight: 500; margin: 0 0 18px; }
  .summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; min-width: 140px; }
  .stat b { display: block; font-family: var(--mono); font-size: 26px; font-weight: 600; }
  .stat span { font-size: 12px; color: var(--text-2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card.attn { border-color: rgba(255, 184, 0, 0.55); box-shadow: 0 0 18px rgba(255, 184, 0, 0.12); }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .card h2 { margin: 0; font-size: 17px; }
  .card .root { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }
  .open-btn { all: unset; cursor: pointer; font-family: var(--mono); font-size: 11px; color: var(--accent); border: 1px solid var(--line); padding: 4px 10px; border-radius: 4px; white-space: nowrap; }
  .open-btn:hover { background: rgba(var(--accent-rgb), 0.1); }
  .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: rgba(148, 163, 184, 0.12); }
  .bar i { display: block; height: 100%; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); }
  .counts b { font-family: var(--mono); color: var(--text); font-weight: 600; }
  .sessions { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .sessions li { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
  .sessions .sname { font-weight: 600; }
  .sessions .sstate { color: var(--text-2); }
  .sessions .sinfo { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .wip-list { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--text-2); display: flex; flex-direction: column; gap: 4px; }
  .wip-list code { font-family: var(--mono); color: var(--amber); margin-right: 6px; }
  .section-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 28px 0 12px; }
  .switch { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { width: 34px; height: 18px; border-radius: 9px; background: rgba(148, 163, 184, 0.25); position: relative; transition: background 0.15s; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-2); transition: transform 0.15s, background 0.15s; }
  .switch input:checked + .track { background: rgba(var(--accent-rgb), 0.35); }
  .switch input:checked + .track::after { transform: translateX(16px); background: var(--accent); }
  .switch input:focus-visible + .track { outline: 1px solid var(--accent); outline-offset: 2px; }
  .switch .hint { color: var(--muted); }
  .empty { color: var(--text-2); font-size: 14px; padding: 24px; border: 1px dashed var(--line); border-radius: 8px; }
  .err { color: var(--red); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
    Mission Control
  </div>
  <nav id="tabs" role="tablist" aria-label="Progetti"></nav>
  <label class="filter" id="epicBox" hidden>Epic
    <select id="epicSel" title="Mostra tutto il progetto o un solo epic"></select>
  </label>
  <div class="meta"><button id="fx" type="button" title="Animazioni, sfocature e ombre dei pannelli. Spente consumano meno RAM.">animazioni</button><span id="conn">…</span><span id="clock"></span></div>
</header>
<main id="views">
  <section id="overview" class="view active" role="tabpanel"><div class="empty">Lettura delle sessioni e dei tracker bd…</div></section>
</main>
<script>
(() => {
  const POLL_MS = 5000;
  const STATUS_LABEL = { busy: "al lavoro", waiting: "attende input", shell: "shell in corso", idle: "inattiva", unknown: "?" };
  const STATUS_RANK = { waiting: 4, busy: 3, shell: 2, idle: 1, unknown: 0 };
  const tabsEl = document.getElementById("tabs");
  const viewsEl = document.getElementById("views");
  const overviewEl = document.getElementById("overview");
  const frames = new Map();
  let state = null;
  let active = "overview";
  try { active = localStorage.getItem("mc-active") || "overview"; } catch {}

  // Animazioni dei pannelli: accese di default; l'interruttore in alto passa alla modalita' leggera
  // (meno RAM). La scelta vale per questo browser.
  let fxOn = true;
  try { fxOn = localStorage.getItem("mc-fx") !== "off"; } catch {}
  const fxBtn = document.getElementById("fx");
  const fxQuery = () => (fxOn ? "?full=1" : "?lite=1");
  const renderFx = () => { fxBtn.textContent = fxOn ? "animazioni: on" : "animazioni: off"; fxBtn.setAttribute("aria-pressed", String(fxOn)); };
  renderFx();
  fxBtn.addEventListener("click", () => {
    fxOn = !fxOn;
    try { localStorage.setItem("mc-fx", fxOn ? "on" : "off"); } catch {}
    renderFx();
    for (const [, sec] of frames) delete sec.dataset.src; // forza il ricaricamento del pannello aperto
    select(active);
  });

  // Indirizzo condivisibile: #<slug> apre la scheda del progetto, #<slug>/e/<epic> anche l'epic.
  // Senza ancora vale l'ultima scheda usata in questo browser. Un'ancora senza epic non tocca l'epic salvato.
  function readHash() {
    const m = /^#([^/]+)(?:\/e\/(.+))?$/.exec(location.hash);
    if (!m) return null;
    try { return { slug: decodeURIComponent(m[1]), epic: m[2] ? decodeURIComponent(m[2]) : "" }; } catch { return null; }
  }
  function applyHash() {
    const h = readHash();
    if (!h) return false;
    if (h.epic) { try { localStorage.setItem(`mc-epic-${h.slug}`, h.epic); } catch {} }
    active = h.slug;
    return true;
  }
  function writeHash(slug, epic) {
    const want = slug === "overview" ? "" : `#${encodeURIComponent(slug)}${epic ? `/e/${encodeURIComponent(epic)}` : ""}`;
    if (location.hash === want) return;
    try { history.replaceState(null, "", want || location.pathname + location.search); } catch {}
  }
  applyHash();
  window.addEventListener("hashchange", () => {
    const h = readHash();
    if (h?.epic) { try { localStorage.setItem(`mc-epic-${h.slug}`, h.epic); } catch {} }
    const slug = h ? h.slug : "overview";
    if (state) select(slug); else active = slug;
  });

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ago = (ms) => {
    if (!ms) return "";
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return `${s}s fa`;
    if (s < 3600) return `${Math.round(s / 60)} min fa`;
    if (s < 86400) return `${Math.round(s / 3600)} h fa`;
    return `${Math.round(s / 86400)} g fa`;
  };
  const waitText = (s) => s.status === "waiting" && s.waitingFor ? `attende: ${s.waitingFor}` : (STATUS_LABEL[s.status] || s.status);
  const topStatus = (p) => p.sessions.reduce((best, s) => (STATUS_RANK[s.status] ?? 0) > (STATUS_RANK[best] ?? -1) ? s.status : best, p.sessions.length ? "unknown" : "none");

  // Filtro per epic: scelta salvata per progetto; "" = tutto il progetto.
  const epicBox = document.getElementById("epicBox");
  const epicSel = document.getElementById("epicSel");
  let epicSig = "";
  function epicFor(slug) {
    let id = "";
    try { id = localStorage.getItem(`mc-epic-${slug}`) || ""; } catch {}
    const p = state?.projects.find((x) => x.slug === slug);
    return id && p?.epics?.some((e) => e.id === id) ? id : "";
  }
  function renderEpicSelect() {
    const p = active !== "overview" ? state?.projects.find((x) => x.slug === active) : null;
    const epics = p?.epics || [];
    epicBox.hidden = !epics.length;
    if (!epics.length) { epicSig = ""; return; }
    const sig = active + "|" + epics.map((e) => `${e.id}:${e.status}:${e.open}:${e.in_progress}:${e.total}:${e.title}`).join("|");
    if (sig !== epicSig) {
      epicSig = sig;
      const opt = (e) => `<option value="${esc(e.id)}">${esc(e.title || e.id)} (${e.open + e.in_progress} da fare / ${e.total})</option>`;
      const openE = epics.filter((e) => e.status !== "closed");
      const closedE = epics.filter((e) => e.status === "closed");
      epicSel.innerHTML = `<option value="">Tutto il progetto</option>`
        + (openE.length ? `<optgroup label="Epic aperti">${openE.map(opt).join("")}</optgroup>` : "")
        + (closedE.length ? `<optgroup label="Epic chiusi">${closedE.map(opt).join("")}</optgroup>` : "");
    }
    epicSel.value = epicFor(active);
  }
  epicSel.addEventListener("change", () => {
    try { localStorage.setItem(`mc-epic-${active}`, epicSel.value); } catch {}
    select(active);
  });

  function select(slug) {
    if (slug !== "overview" && !state?.projects.some((p) => p.slug === slug && p.hasBeads)) slug = "overview";
    const changed = active !== slug;
    active = slug;
    try { localStorage.setItem("mc-active", slug); } catch {}
    if (changed && state) return renderTabs();
    // Un solo pannello in memoria: quelli delle schede non visibili vengono scaricati (risparmio RAM).
    for (const [s, sec] of frames) if (s !== slug) { sec.firstChild?.removeAttribute("src"); sec.remove(); frames.delete(s); }
    if (slug !== "overview") {
      const epic = epicFor(slug);
      let sec = frames.get(slug);
      if (!sec) {
        sec = document.createElement("section");
        sec.className = "view"; sec.setAttribute("role", "tabpanel");
        const f = document.createElement("iframe");
        f.title = `Pannello ${slug}`;
        sec.appendChild(f);
        viewsEl.appendChild(sec);
        frames.set(slug, sec);
      }
      const src = `/p/${encodeURIComponent(slug)}/${epic ? `e/${encodeURIComponent(epic)}/` : ""}orchestration.html${fxQuery()}`;
      if (sec.dataset.src !== src) {
        sec.dataset.src = src;
        sec.firstChild.src = src;
      }
    }
    renderEpicSelect();
    if (state) writeHash(slug, slug === "overview" ? "" : epicFor(slug));
    overviewEl.classList.toggle("active", slug === "overview");
    for (const [s, sec] of frames) sec.classList.toggle("active", s === slug);
    for (const t of tabsEl.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t.dataset.slug === slug));
  }

  function renderTabs() {
    const items = [{ slug: "overview", label: "Panoramica", overview: true }, ...state.projects.filter((p) => p.hasBeads && (p.sessions.length || p.pinned || p.slug === active))];
    tabsEl.innerHTML = items.map((p, i) => {
      if (p.overview) {
        const waiting = state.projects.filter((x) => topStatus(x) === "waiting").length;
        return `<button class="tab" role="tab" data-slug="overview" title="Tutte le sessioni (Alt+0)"><span class="label">Panoramica</span>${waiting ? `<span class="badge wip">${waiting} in attesa</span>` : ""}<span class="key">0</span></button>`;
      }
      const st = topStatus(p);
      const wip = p.counts?.in_progress || 0;
      const open = p.counts?.open || 0;
      const names = p.sessions.map((s) => `${s.name} — ${waitText(s)}`).join("\n") || "nessuna sessione aperta";
      return `<button class="tab" role="tab" data-slug="${esc(p.slug)}" title="${esc(p.root)}\n${esc(names)}">
        <span class="dot ${esc(st)}"></span><span class="label">${esc(p.label)}</span>
        ${wip ? `<span class="badge wip" title="in corso">${wip}▸</span>` : ""}<span class="badge" title="aperti">${open}</span>
        ${i < 10 ? `<span class="key">${i}</span>` : ""}</button>`;
    }).join("");
    for (const t of tabsEl.querySelectorAll(".tab")) t.addEventListener("click", () => select(t.dataset.slug));
    const live = new Set(state.projects.filter((p) => p.hasBeads).map((p) => p.slug));
    for (const [s, sec] of frames) if (!live.has(s)) { sec.remove(); frames.delete(s); }
    select(active);
  }

  function counts(c) {
    if (!c) return "";
    const total = c.total || 1;
    const seg = [["closed", "var(--green)"], ["in_progress", "var(--amber)"], ["blocked", "var(--red)"], ["open", "var(--accent)"], ["deferred", "var(--muted)"]];
    return `<div class="bar" aria-hidden="true">${seg.map(([k, col]) => c[k] ? `<i style="width:${(c[k] / total) * 100}%;background:${col}"></i>` : "").join("")}</div>
      <div class="counts"><span><b>${c.open}</b> aperti</span><span><b>${c.in_progress}</b> in corso</span><span><b>${c.blocked}</b> bloccati</span><span><b>${c.closed}</b> chiusi${c.closed ? ` · <b>${c.closedVerified}</b> verificati` : ""}</span>${c.deferred ? `<span><b>${c.deferred}</b> rimandati</span>` : ""}</div>`;
  }

  function card(p) {
    const st = topStatus(p);
    const sess = p.sessions.length
      ? `<ul class="sessions">${p.sessions.map((s) => `<li title="pid ${esc(s.pid)} · ${esc(s.cwd)}"><span class="dot ${esc(s.status)}"></span><span class="sname">${esc(s.name)}</span><span class="sstate">${esc(waitText(s))}</span><span class="sinfo">${esc(s.profile)} · ${esc(ago(s.updatedAt))}</span></li>`).join("")}</ul>`
      : (state.hideSessions ? "" : `<div class="counts">nessuna sessione aperta${p.pinned ? " (fissato)" : ""}</div>`);
    const wip = p.counts?.active?.length
      ? `<ul class="wip-list">${p.counts.active.map((a) => `<li><code>${esc(a.id)}</code>${esc(a.title)}${a.assignee ? ` <span style="color:var(--muted)">· ${esc(a.assignee)}</span>` : ""}</li>`).join("")}</ul>` : "";
    return `<article class="card ${st === "waiting" ? "attn" : ""}">
      <div class="card-head"><div><h2>${esc(p.label)}</h2><div class="root">${esc(p.root)}</div></div>
      ${p.hasBeads ? `<button class="open-btn" data-open="${esc(p.slug)}">apri pannello →</button>` : ""}</div>
      ${sess}${counts(p.counts)}${wip}
      ${p.source && p.source !== "bd export" ? `<div class="counts err">fonte dati: ${esc(p.source)}</div>` : ""}
    </article>`;
  }

  // Interruttore della Panoramica: tutti i progetti con bead del PC (default) oppure solo quelli con una sessione aperta.
  let showAll = true;
  try { showAll = localStorage.getItem("mc-show-all") !== "0"; } catch {}
  function renderOverview() {
    const allBeads = state.projects.filter((p) => p.hasBeads);
    const rank = (p) => (p.sessions.length ? 0 : p.pinned ? 1 : 2);
    const withBeads = allBeads.filter((p) => showAll || p.sessions.length).sort((a, b) => rank(a) - rank(b));
    const hiddenCount = allBeads.length - withBeads.length;
    const without = state.projects.filter((p) => !p.hasBeads);
    const allSessions = state.projects.flatMap((p) => p.sessions);
    const sum = (k) => withBeads.reduce((n, p) => n + (p.counts?.[k] || 0), 0);
    const by = (s) => allSessions.filter((x) => x.status === s).length;
    overviewEl.innerHTML = `
      <h1>${state.hideSessions ? "Progetti" : `Sessioni Claude aperte su ${esc(state.host)}`}</h1>
      <div class="summary">
        ${state.hideSessions ? "" : `<div class="stat"><b>${allSessions.length}</b><span>sessioni vive</span></div>
        <div class="stat"><b style="color:var(--amber)">${by("waiting")}</b><span>attendono input</span></div>
        <div class="stat"><b style="color:var(--green)">${by("busy") + by("shell")}</b><span>al lavoro</span></div>`}
        <div class="stat"><b>${withBeads.length}</b><span>progetti con bead</span></div>
        <div class="stat"><b style="color:var(--amber)">${sum("in_progress")}</b><span>bead in corso</span></div>
        <div class="stat"><b style="color:var(--accent)">${sum("open")}</b><span>bead aperti</span></div>
      </div>
      ${state.hideSessions ? "" : `<label class="switch"><input type="checkbox" id="showAll" ${showAll ? "checked" : ""}><span class="track" aria-hidden="true"></span>
        Tutti i progetti con bead${showAll ? "" : ` <span class="hint">(${hiddenCount} senza sessione nascosti)</span>`}</label>`}
      ${withBeads.length ? `<div class="grid">${withBeads.map(card).join("")}</div>` : `<div class="empty">Nessuna sessione aperta su un progetto con bead.</div>`}
      ${without.length ? `<div class="section-title">Sessioni senza tracker bd</div><div class="grid">${without.map(card).join("")}</div>` : ""}`;
    for (const b of overviewEl.querySelectorAll("[data-open]")) b.addEventListener("click", () => select(b.dataset.open));
    overviewEl.querySelector("#showAll")?.addEventListener("change", (e) => {
      showAll = e.target.checked;
      try { localStorage.setItem("mc-show-all", showAll ? "1" : "0"); } catch {}
      renderOverview();
    });
  }

  let lastOk = 0;
  async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      state = await r.json();
      lastOk = Date.now();
      renderTabs();
      renderOverview();
      const waiting = state.projects.filter((p) => topStatus(p) === "waiting").length;
      document.title = waiting ? `(${waiting}) Mission Control` : "Mission Control";
    } catch (e) { console.warn("poll fallito", e); }
    updateConn();
  }
  function updateConn() {
    const conn = document.getElementById("conn");
    const fresh = Date.now() - lastOk < POLL_MS * 3;
    conn.textContent = lastOk ? (fresh ? "● live" : "● server non raggiungibile") : "connessione…";
    conn.className = fresh ? "live" : "stale";
    document.getElementById("clock").textContent = new Date().toLocaleTimeString("it-IT");
  }
  document.addEventListener("keydown", (e) => {
    if (!e.altKey || !/^[0-9]$/.test(e.key)) return;
    const t = tabsEl.querySelectorAll(".tab")[Number(e.key)];
    if (t) { e.preventDefault(); select(t.dataset.slug); }
  });
  poll();
  setInterval(poll, POLL_MS);
  setInterval(updateConn, 1000);
})();
</script>
</body>
</html>
